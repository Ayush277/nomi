  <line x1="856" y1="163" x2="888" y2="163" stroke="#a78bfa" stroke-width="2" marker-end="url(#m)"/>

  <!-- row 2 -->
  <line x1="967" y1="206" x2="967" y2="240" stroke="#a78bfa" stroke-width="2" marker-end="url(#m)"/>
  <rect x="700" y="248" width="342" height="86" rx="14" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="716" y="276" fill="#f5f6f8" font-size="14" font-weight="600">Learned profile (3+ days of evidence)</text>
  <text x="716" y="298" fill="#8b87a0" font-size="11.5">peak hours · favorite tech · main project ·</text>
  <text x="716" y="314" fill="#8b87a0" font-size="11.5">distractions · week-over-week change diffs</text>

  <line x1="696" y1="291" x2="600" y2="291" stroke="#a78bfa" stroke-width="2" marker-end="url(#m)"/>
  <rect x="316" y="248" width="280" height="86" rx="14" fill="#1a1526" stroke="#7c3aed"/>
  <text x="332" y="276" fill="#c4b5fd" font-size="14" font-weight="600">The living document</text>
  <text x="332" y="298" fill="#8b87a0" font-size="11.5">auto-written markdown: profile, changes,</text>
  <text x="332" y="314" fill="#8b87a0" font-size="11.5">weekly reviews, daily log, things you told me</text>

  <line x1="312" y1="291" x2="230" y2="291" stroke="#a78bfa" stroke-width="2" marker-end="url(#m)"/>
  <rect x="40" y="248" width="186" height="86" rx="14" fill="#1a1526" stroke="#7c3aed"/>
  <text x="56" y="276" fill="#c4b5fd" font-size="14" font-weight="600">RAG index</text>
  <text x="56" y="298" fill="#8b87a0" font-size="11.5">embedded passages,</text>
  <text x="56" y="314" fill="#8b87a0" font-size="11.5">searchable by meaning</text>

  <text x="40" y="392" fill="#8b87a0" font-size="12.5">Chat quotes this chain as evidence: "Yesterday: 3h 20m online, mostly github.com" is a rollup, not a guess.</text>
