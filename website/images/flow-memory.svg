    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L8,3L0,6z" fill="#a78bfa"/></marker>
    <radialGradient id="orb2" cx="36%" cy="27%"><stop offset="0%" stop-color="#f0ecff"/><stop offset="46%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#6d28d9"/></radialGradient>
  </defs>
  <rect width="1080" height="430" rx="18" fill="#0b0a10"/>
  <text x="40" y="52" fill="#f5f6f8" font-size="22" font-weight="700" font-family="-apple-system,SF Pro Display,sans-serif">The memory pipeline</text>
  <text x="40" y="76" fill="#8b87a0" font-size="13">from a tab switch to a fact Nomi can quote, entirely on-device</text>
  <circle cx="1010" cy="56" r="22" fill="url(#orb2)"/><circle cx="1003" cy="54" r="3" fill="#fff"/><circle cx="1017" cy="54" r="3" fill="#fff"/>

  <!-- row 1 -->
  <rect x="40" y="120" width="185" height="86" rx="14" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="56" y="148" fill="#f5f6f8" font-size="14" font-weight="600">Tab / idle events</text>
  <text x="56" y="170" fill="#8b87a0" font-size="11.5">focus change, url change,</text>
  <text x="56" y="186" fill="#8b87a0" font-size="11.5">idle start/stop</text>

  <rect x="262" y="120" width="185" height="86" rx="14" fill="#1a1526" stroke="#7c3aed"/>
  <text x="278" y="148" fill="#c4b5fd" font-size="14" font-weight="600">Privacy gate</text>
  <text x="278" y="170" fill="#8b87a0" font-size="11.5">blocklist · exclusions ·</text>
  <text x="278" y="186" fill="#8b87a0" font-size="11.5">incognito · strip queries</text>

  <rect x="484" y="120" width="185" height="86" rx="14" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="500" y="148" fill="#f5f6f8" font-size="14" font-weight="600">Encrypted events</text>
  <text x="500" y="170" fill="#6ee7b7" font-size="11.5">AES-GCM · IndexedDB</text>
  <text x="500" y="186" fill="#8b87a0" font-size="11.5">7 days raw detail</text>

  <rect x="706" y="120" width="150" height="86" rx="14" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="722" y="148" fill="#f5f6f8" font-size="14" font-weight="600">Sessions</text>
  <text x="722" y="170" fill="#8b87a0" font-size="11.5">domain · category</text>
  <text x="722" y="186" fill="#8b87a0" font-size="11.5">duration</text>

  <rect x="892" y="120" width="150" height="86" rx="14" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="908" y="148" fill="#f5f6f8" font-size="14" font-weight="600">Day rollups</text>
  <text x="908" y="170" fill="#8b87a0" font-size="11.5">compaction, kept</text>
  <text x="908" y="186" fill="#8b87a0" font-size="11.5">forever, tiny</text>

  <line x1="225" y1="163" x2="258" y2="163" stroke="#a78bfa" stroke-width="2" marker-end="url(#m)"/>
  <line x1="447" y1="163" x2="480" y2="163" stroke="#a78bfa" stroke-width="2" marker-end="url(#m)"/>
