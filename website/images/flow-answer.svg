<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" font-family="ui-monospace,SF Mono,Menlo,monospace">
  <defs>
    <marker id="w" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L8,3L0,6z" fill="#a78bfa"/></marker>
    <radialGradient id="orb3" cx="36%" cy="27%"><stop offset="0%" stop-color="#f0ecff"/><stop offset="46%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#6d28d9"/></radialGradient>
  </defs>
  <rect width="1080" height="560" rx="18" fill="#0b0a10"/>
  <text x="40" y="52" fill="#f5f6f8" font-size="22" font-weight="700" font-family="-apple-system,SF Pro Display,sans-serif">How a question becomes an answer</text>
  <text x="40" y="76" fill="#8b87a0" font-size="13">~70% of questions never reach a model — deterministic first, AI when it earns it</text>
  <circle cx="1010" cy="56" r="22" fill="url(#orb3)"/><circle cx="1003" cy="54" r="3" fill="#fff"/><circle cx="1017" cy="54" r="3" fill="#fff"/>

  <rect x="40" y="110" width="220" height="64" rx="14" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="56" y="137" fill="#f5f6f8" font-size="14" font-weight="600">"what did I save?"</text>
  <text x="56" y="158" fill="#8b87a0" font-size="11.5">typed or spoken, + page ref</text>

  <line x1="150" y1="174" x2="150" y2="204" stroke="#a78bfa" stroke-width="2" marker-end="url(#w)"/>

  <rect x="40" y="210" width="480" height="92" rx="14" fill="#1a1526" stroke="#7c3aed"/>
  <text x="56" y="238" fill="#c4b5fd" font-size="14" font-weight="600">1 · Intent handlers (30+, deterministic, 0 ms, $0)</text>
  <text x="56" y="260" fill="#8b87a0" font-size="11.5">bag save/recall · reminders/timers · journal · "what was I doing" ·</text>
  <text x="56" y="276" fill="#8b87a0" font-size="11.5">"when do I work best" · memory questions · forget/remove commands</text>
  <text x="340" y="294" fill="#6ee7b7" font-size="12">handler hit → answered, done ✓</text>

  <line x1="150" y1="302" x2="150" y2="332" stroke="#a78bfa" stroke-width="2" marker-end="url(#w)"/>
  <text x="162" y="326" fill="#8b87a0" font-size="11.5">no handler matched — build the grounded prompt</text>

  <rect x="40" y="338" width="480" height="118" rx="14" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="56" y="366" fill="#f5f6f8" font-size="14" font-weight="600">2 · Grounding (all local reads)</text>
  <text x="56" y="388" fill="#8b87a0" font-size="11.5">persona + profile + goal · today's summary · live context ·</text>
  <text x="56" y="404" fill="#8b87a0" font-size="11.5">RAG: top-5 doc passages (hybrid) · top-3 day-memory passages ·</text>
  <text x="56" y="420" fill="#8b87a0" font-size="11.5">companion brief · rule: answer exactly, admit "I don't have that"</text>
  <text x="56" y="442" fill="#c4b5fd" font-size="11.5">multi-step? → ReAct agent: Thought → tool → Observation → loop → FINAL</text>

  <line x1="520" y1="397" x2="580" y2="397" stroke="#a78bfa" stroke-width="2" marker-end="url(#w)"/>

  <rect x="586" y="338" width="454" height="118" rx="14" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="602" y="366" fill="#f5f6f8" font-size="14" font-weight="600">3 · Provider chain (graceful degradation)</text>
  <text x="602" y="390" fill="#8b87a0" font-size="12">Gemini (user's key)</text>
  <text x="602" y="410" fill="#8b87a0" font-size="12">→ Ollama (fully local)  → free fallback</text>
  <text x="602" y="430" fill="#8b87a0" font-size="12">→ honest canned reply — never silence</text>

  <line x1="813" y1="456" x2="813" y2="486" stroke="#a78bfa" stroke-width="2" marker-end="url(#w)"/>

  <rect x="586" y="492" width="454" height="52" rx="14" fill="#1a1526" stroke="#7c3aed"/>
  <text x="602" y="518" fill="#c4b5fd" font-size="13" font-weight="600">4 · Never-repeat guard</text>
  <text x="602" y="536" fill="#8b87a0" font-size="12">same as last reply? re-answer from ground truth</text>

  <rect x="586" y="110" width="454" height="192" rx="14" fill="#131019" stroke="#2c2440"/>
  <text x="606" y="140" fill="#a78bfa" font-size="12" letter-spacing="2">AGENT TOOLS (ALL LOCAL)</text>
  <text x="606" y="168" fill="#f5f6f8" font-size="13">memory(query)   — sessions, rollups, signals</text>
  <text x="606" y="192" fill="#f5f6f8" font-size="13">docs(query)     — the user's knowledge base</text>
  <text x="606" y="216" fill="#f5f6f8" font-size="13">today()         — live stats for the day</text>
  <text x="606" y="240" fill="#f5f6f8" font-size="13">profile()       — who they are, the goal</text>
  <text x="606" y="264" fill="#f5f6f8" font-size="13">page()          — visible text of this page</text>
  <text x="606" y="290" fill="#8b87a0" font-size="11.5">bounded loop — the model asks, the tool runs, evidence returns</text>
</svg>
