<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" font-family="ui-monospace,SF Mono,Menlo,monospace">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L8,3L0,6z" fill="#a78bfa"/></marker>
    <radialGradient id="orb" cx="36%" cy="27%"><stop offset="0%" stop-color="#f0ecff"/><stop offset="46%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#6d28d9"/></radialGradient>
  </defs>
  <rect width="1080" height="640" rx="18" fill="#0b0a10"/>
  <text x="40" y="52" fill="#f5f6f8" font-size="22" font-weight="700" font-family="-apple-system,SF Pro Display,sans-serif">Nomi · system architecture</text>
  <text x="40" y="76" fill="#8b87a0" font-size="13">everything runs inside the browser · no server</text>
  <circle cx="1010" cy="56" r="22" fill="url(#orb)"/><circle cx="1003" cy="54" r="3" fill="#fff"/><circle cx="1017" cy="54" r="3" fill="#fff"/>

  <!-- page column -->
  <rect x="40" y="110" width="300" height="330" rx="16" fill="#131019" stroke="#2c2440"/>
  <text x="60" y="140" fill="#a78bfa" font-size="12" letter-spacing="2">EVERY WEB PAGE</text>
  <rect x="60" y="158" width="260" height="92" rx="12" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="76" y="184" fill="#f5f6f8" font-size="14" font-weight="600">Widget (React, Shadow DOM)</text>
  <text x="76" y="206" fill="#8b87a0" font-size="12">orb · chat sheet · bubbles</text>
  <text x="76" y="224" fill="#8b87a0" font-size="12">satellite chips · voice UI</text>
  <rect x="60" y="266" width="260" height="74" rx="12" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="76" y="292" fill="#f5f6f8" font-size="14" font-weight="600">Site adapters (whitelisted)</text>
  <text x="76" y="314" fill="#8b87a0" font-size="12">LeetCode · YouTube · GfG → signals</text>
  <rect x="60" y="356" width="260" height="66" rx="12" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="76" y="382" fill="#f5f6f8" font-size="14" font-weight="600">Extension pages</text>
  <text x="76" y="404" fill="#8b87a0" font-size="12">dashboard · settings · popup</text>

  <!-- worker column -->
  <rect x="390" y="110" width="300" height="330" rx="16" fill="#131019" stroke="#2c2440"/>
  <text x="410" y="140" fill="#a78bfa" font-size="12" letter-spacing="2">MV3 SERVICE WORKER · STATELESS</text>
  <rect x="410" y="158" width="260" height="58" rx="12" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="426" y="182" fill="#f5f6f8" font-size="14" font-weight="600">Message router</text>
  <text x="426" y="202" fill="#8b87a0" font-size="12">every handler cold-start safe</text>
  <rect x="410" y="228" width="260" height="58" rx="12" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="426" y="252" fill="#f5f6f8" font-size="14" font-weight="600">Tracker + privacy gate</text>
  <text x="426" y="272" fill="#8b87a0" font-size="12">tab/idle events → sessions</text>
  <rect x="410" y="298" width="260" height="58" rx="12" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="426" y="322" fill="#f5f6f8" font-size="14" font-weight="600">Chat brain (chat.ts)</text>
  <text x="426" y="342" fill="#8b87a0" font-size="12">intents → RAG → agent → model</text>
  <rect x="410" y="368" width="260" height="58" rx="12" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="426" y="392" fill="#f5f6f8" font-size="14" font-weight="600">chrome.alarms jobs</text>
  <text x="426" y="412" fill="#8b87a0" font-size="12">nudges · rollups · briefs · reviews</text>

  <!-- storage column -->
  <rect x="740" y="110" width="300" height="330" rx="16" fill="#131019" stroke="#2c2440"/>
  <text x="760" y="140" fill="#a78bfa" font-size="12" letter-spacing="2">ON-DEVICE STORAGE</text>
  <rect x="760" y="158" width="260" height="80" rx="12" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="776" y="182" fill="#f5f6f8" font-size="14" font-weight="600">IndexedDB (Dexie)</text>
  <text x="776" y="202" fill="#8b87a0" font-size="12">events · sessions · rollups</text>
  <text x="776" y="222" fill="#6ee7b7" font-size="12">AES-GCM encrypted at rest</text>
  <rect x="760" y="254" width="260" height="96" rx="12" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="776" y="278" fill="#f5f6f8" font-size="14" font-weight="600">chrome.storage.local</text>
  <text x="776" y="298" fill="#8b87a0" font-size="12">settings · profile · bag · docs</text>
  <text x="776" y="316" fill="#8b87a0" font-size="12">reminders · journal · autodoc</text>
  <text x="776" y="334" fill="#8b87a0" font-size="12">vector indexes · learned profile</text>
  <rect x="760" y="366" width="260" height="60" rx="12" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="776" y="390" fill="#f5f6f8" font-size="14" font-weight="600">chrome.storage.session</text>
  <text x="776" y="410" fill="#8b87a0" font-size="12">chat · bubble · live visit</text>

  <!-- arrows -->
  <line x1="340" y1="230" x2="386" y2="230" stroke="#a78bfa" stroke-width="2" marker-end="url(#a)"/>
  <line x1="386" y1="260" x2="340" y2="260" stroke="#a78bfa" stroke-width="2" marker-end="url(#a)"/>
  <text x="346" y="220" fill="#8b87a0" font-size="11">messages</text>
  <line x1="690" y1="270" x2="736" y2="270" stroke="#a78bfa" stroke-width="2" marker-end="url(#a)"/>
  <line x1="736" y1="300" x2="690" y2="300" stroke="#a78bfa" stroke-width="2" marker-end="url(#a)"/>
  <text x="700" y="260" fill="#8b87a0" font-size="11">read/write</text>

  <!-- providers -->
  <rect x="240" y="490" width="600" height="100" rx="16" fill="#131019" stroke="#2c2440"/>
  <text x="260" y="520" fill="#a78bfa" font-size="12" letter-spacing="2">AI PROVIDERS · ONLY IF THE USER ENABLES THEM</text>
  <text x="260" y="548" fill="#f5f6f8" font-size="14">Gemini (user's own key)  →  Ollama (localhost, fully local)  →  free fallback  →  honest canned reply</text>
  <text x="260" y="572" fill="#8b87a0" font-size="12">chat · embeddings · voice transcription · vision — each failure falls through, silence never happens</text>
  <line x1="540" y1="440" x2="540" y2="486" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
</svg>
