<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="410" viewBox="0 0 1080 410" font-family="ui-monospace,SF Mono,Menlo,monospace">
  <defs>
    <marker id="v" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L8,3L0,6z" fill="#a78bfa"/></marker>
    <radialGradient id="orb5" cx="36%" cy="27%"><stop offset="0%" stop-color="#f0ecff"/><stop offset="46%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#6d28d9"/></radialGradient>
  </defs>
  <rect width="1080" height="410" rx="18" fill="#0b0a10"/>
  <text x="40" y="52" fill="#f5f6f8" font-size="22" font-weight="700" font-family="-apple-system,SF Pro Display,sans-serif">The voice loop</text>
  <text x="40" y="76" fill="#8b87a0" font-size="13">Nomi speaks only when spoken to — proactive bubbles are always silent</text>
  <circle cx="1010" cy="56" r="22" fill="url(#orb5)"/><circle cx="1003" cy="54" r="3" fill="#fff"/><circle cx="1017" cy="54" r="3" fill="#fff"/>

  <rect x="40" y="120" width="180" height="80" rx="14" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="56" y="148" fill="#f5f6f8" font-size="14" font-weight="600">Hold mic /</text>
  <text x="56" y="166" fill="#f5f6f8" font-size="14" font-weight="600">double-tap orb</text>
  <text x="56" y="188" fill="#8b87a0" font-size="11.5">from any page</text>

  <line x1="220" y1="160" x2="254" y2="160" stroke="#a78bfa" stroke-width="2" marker-end="url(#v)"/>
  <rect x="260" y="120" width="200" height="80" rx="14" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="276" y="148" fill="#f5f6f8" font-size="14" font-weight="600">Offscreen doc</text>
  <text x="276" y="168" fill="#8b87a0" font-size="11.5">captures audio — MV3</text>
  <text x="276" y="184" fill="#8b87a0" font-size="11.5">workers can't touch the mic</text>

  <line x1="460" y1="160" x2="494" y2="160" stroke="#a78bfa" stroke-width="2" marker-end="url(#v)"/>
  <rect x="500" y="120" width="200" height="80" rx="14" fill="#1a1526" stroke="#7c3aed"/>
  <text x="516" y="148" fill="#c4b5fd" font-size="14" font-weight="600">Transcribe</text>
  <text x="516" y="168" fill="#8b87a0" font-size="11.5">Gemini · understands</text>
  <text x="516" y="184" fill="#8b87a0" font-size="11.5">Hinglish too</text>

  <line x1="700" y1="160" x2="734" y2="160" stroke="#a78bfa" stroke-width="2" marker-end="url(#v)"/>
  <rect x="740" y="120" width="200" height="80" rx="14" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="756" y="148" fill="#f5f6f8" font-size="14" font-weight="600">Same chat brain</text>
  <text x="756" y="168" fill="#8b87a0" font-size="11.5">intents → RAG → agent —</text>
  <text x="756" y="184" fill="#8b87a0" font-size="11.5">identical to typed chat</text>

  <line x1="840" y1="200" x2="840" y2="234" stroke="#a78bfa" stroke-width="2" marker-end="url(#v)"/>
  <rect x="740" y="240" width="200" height="80" rx="14" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="756" y="268" fill="#f5f6f8" font-size="14" font-weight="600">Speak the reply</text>
  <text x="756" y="288" fill="#8b87a0" font-size="11.5">best system voice, sentence-</text>
  <text x="756" y="304" fill="#8b87a0" font-size="11.5">chunked vs Chrome cutoff</text>

  <line x1="736" y1="280" x2="560" y2="280" stroke="#a78bfa" stroke-width="2" marker-end="url(#v)"/>
  <rect x="340" y="240" width="216" height="80" rx="14" fill="#1a1526" stroke="#7c3aed"/>
  <text x="356" y="268" fill="#c4b5fd" font-size="14" font-weight="600">Conversation mode</text>
  <text x="356" y="288" fill="#8b87a0" font-size="11.5">speech ends → mic reopens once</text>
  <text x="356" y="304" fill="#8b87a0" font-size="11.5">for a follow-up · silence ends it</text>

  <line x1="336" y1="280" x2="160 " y2="280" stroke="#a78bfa" stroke-width="2" marker-end="url(#v)"/>
  <rect x="40" y="240" width="116" height="80" rx="14" fill="#1a1526" stroke="#3b2f5c"/>
  <text x="56" y="268" fill="#f5f6f8" font-size="14" font-weight="600">Tap orb</text>
  <text x="56" y="288" fill="#8b87a0" font-size="11.5">= stop talking</text>
  <text x="56" y="304" fill="#8b87a0" font-size="11.5">(barge-in)</text>

  <text x="40" y="374" fill="#8b87a0" font-size="12.5">Speech synthesis never leaves the device; only the mic clip goes to Gemini, only for transcription.</text>
</svg>
